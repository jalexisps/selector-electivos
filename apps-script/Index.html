<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de Electivos</title>
<link rel="preconnect" href="https:&#47;&#47;fonts.googleapis.com">
<link rel="preconnect" href="https:&#47;&#47;fonts.gstatic.com" crossorigin>
<link href="https:&#47;&#47;fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mismos tonos que el sistema de las Olimpiadas: fondo verde grisáceo, tinta verde oscuro y gris */
  --bg:#EEF2EF; --card:#FFFFFF; --ink:#18241E; --muted:#5D6964; --soft:#8A958F; --line:#D9E2DC; --line2:#E7EDE9;
  --gris:#59646A; --gris-osc:#262D30; --gris-claro:#E3E9E5;
  --pri:#067D3E; --pri-ink:#fff; --sec:#EAEA17; --sec-ink:#1D2327;
  --pri-soft:color-mix(in srgb,var(--pri) 11%,#fff); --pri-hover:color-mix(in srgb,var(--pri) 82%,#000);
  --pri-osc:color-mix(in srgb,var(--pri) 66%,#000); --pri-luz:color-mix(in srgb,var(--pri) 72%,#2BE38A);
  --ok:#17845A; --ok-soft:#E3F4EC; --warn:#B86E00; --warn-soft:#FBF0DD; --err:#C0353F; --err-soft:#FBE7E8;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(26,33,50,.06),0 6px 20px -8px rgba(26,33,50,.12);
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em;font-weight:900}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid transparent;border-radius:var(--r-sm);padding:.7em 1.15em;font-weight:700;cursor:pointer;background:#fff;border-color:var(--line);transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#BFC5CA}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn-pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn-danger{color:var(--err)}
.btn-danger.solid{background:var(--err);color:#fff;border-color:var(--err)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(26,33,50,.06);border-color:transparent;color:var(--ink)}
.btn-sm{padding:.45em .8em;font-size:.9rem;border-radius:8px}
.btn-block{width:100%}
.btn .spin{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- Formularios ---------- */
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:14px}
label.f>span{display:block;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.72em .85em;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
textarea.inp{resize:vertical;min-height:120px;font-family:var(--mono);font-size:.88rem;line-height:1.5}
.pw{position:relative}
.pw .inp{padding-right:4.2em}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer;padding:.4em .6em;border-radius:6px}
.pw button:hover{background:var(--line2)}
.form-err{color:var(--err);font-weight:600;font-size:.92rem;min-height:1.3em;margin:-4px 0 10px}
.hint{color:var(--muted);font-size:.9rem}

/* ---------- Marca ---------- */
.marca{width:36px;height:36px;flex:none}
img.marca{object-fit:contain;width:auto;max-width:72px}
.logos-login{display:flex;align-items:center;gap:14px;margin-bottom:16px;min-height:46px}
.logos-login img{height:96px;max-width:150px;object-fit:contain;transition:transform .25s ease}
.logos-login img:hover{transform:scale(1.06) rotate(-1deg)}
.banda{height:5px;background:linear-gradient(90deg,var(--pri) 0 60%,var(--sec) 60% 100%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-weight:800;font-size:1rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;
  background:
    radial-gradient(circle at 15% 0%,var(--pri-luz) 0,transparent 45%),
    radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--sec) 14%,transparent) 0,transparent 40%),
    linear-gradient(160deg,var(--pri),var(--pri-osc) 55%,var(--gris-osc))}
.login-card{width:100%;max-width:410px;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:30px 26px 24px;border:1px solid var(--line2);position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--pri) 0 60%,var(--sec) 60% 100%)}
.login-card .marca{width:46px;height:46px;margin-bottom:14px}
.login-card h1{font-size:1.65rem;font-weight:800}
.login-card .colegio{color:var(--muted);margin-top:4px;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line2);border-radius:12px;padding:4px;margin:22px 0 20px}
.seg button{border:0;background:none;padding:.6em;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.login-card .hint{margin-top:16px;text-align:center}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(120deg,var(--pri-osc),var(--pri));border-bottom:4px solid var(--sec);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top .brand small{color:rgba(255,255,255,.78)}
.top .quien small{color:rgba(255,255,255,.72)!important}
.top .btn-ghost{color:rgba(255,255,255,.88)}
.top .btn-ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.top-user{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-user .quien{font-weight:600;font-size:.92rem;margin-right:6px;text-align:right;line-height:1.2}
.top-user .quien small{display:block;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs{padding:2px 0}
.tabs button{border:0;background:rgba(255,255,255,.12);padding:.45em .85em;font-size:.95rem;font-weight:800;color:rgba(255,255,255,.9);cursor:pointer;border-radius:999px;white-space:nowrap;position:relative;transition:background .15s,color .15s}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.24)}
.tabs button.on{background:#fff;color:var(--pri-osc)}
.tabs{gap:5px}
@media(min-width:900px){.top-panel .top-in{flex-wrap:nowrap;gap:12px}.top-panel .tabs{flex:1;min-width:0;margin-left:10px}.top-panel .brand small{max-width:200px}}
@media(min-width:900px){.tabs{order:0;width:auto;margin:0 0 0 18px}}
.top-panel .quien{display:none} /* en el panel UTP el espacio es para las pestañas */
@media(max-width:560px){.brand>div{display:none}.top-in{flex-wrap:nowrap}.top-panel .top-in{flex-wrap:wrap}.top-user .quien{font-size:.86rem}}

.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.wrap-narrow{max-width:880px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:1.45rem;font-weight:800}
.sec-head p{color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}

/* ---------- Avisos ---------- */
.banner{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r);padding:16px 18px;margin-bottom:20px;border:1px solid}
.banner .ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.banner h3{font-size:1.05rem;font-weight:800}
.banner p{margin-top:2px;color:var(--muted)}
.banner.ok{background:var(--ok-soft);border-color:#bfe4d1}.banner.ok .ico{background:var(--ok)}
.banner.warn{background:var(--warn-soft);border-color:#f0d7ae}.banner.warn .ico{background:var(--warn)}
.banner.off{background:var(--gris-claro);border-color:var(--line)}.banner.off .ico{background:var(--soft)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:.25em .7em;font-weight:700;font-size:.82rem}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.abierto{background:var(--ok-soft);color:var(--ok)}
.pill.programado{background:var(--warn-soft);color:var(--warn)}
.pill.cerrado,.pill.finalizado{background:var(--gris-claro);color:var(--muted)}

/* ---------- Familias (estudiante) ---------- */
.saludo{margin:6px 0 18px}
.saludo h1{font-size:1.6rem;font-weight:800}
.saludo p{color:var(--muted);margin-top:4px}
.fams{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.fam{--c:#2442C4;background:var(--card);border-radius:18px;border:1px solid var(--line2);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;position:relative}
.fam::before{content:"";height:7px;background:var(--c)}
.fam-body{padding:18px 18px 16px;display:flex;flex-direction:column;flex:1}
.fam-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.fam-head h3{font-size:1.25rem;font-weight:800;color:var(--c)}
.cupo-tag{font-weight:700;font-size:.8rem;border-radius:999px;padding:.25em .65em;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);white-space:nowrap}
.cupo-tag.poco{background:var(--warn-soft);color:var(--warn)}
.cupo-tag.lleno{background:var(--gris-claro);color:var(--muted)}
.elist{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px;flex:1}
.elist li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.elist li i{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-top:-1px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .5s}
.cupo-txt{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin:7px 0 14px}
.fam .btn-pick{background:var(--c);border-color:var(--c);color:#fff;width:100%}
.fam .btn-pick:hover{filter:brightness(.93)}
.fam.lleno{opacity:.72}
.fam.lleno::after{content:"Completa";position:absolute;top:18px;right:-34px;transform:rotate(35deg);background:var(--ink);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 40px}
.fam.lleno .cupo-tag{visibility:hidden}

/* ---------- Comprobante ---------- */
.comp{max-width:560px;margin:10px auto 0;text-align:center;padding:34px 26px 26px;border-radius:22px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line2);position:relative;overflow:hidden}
.comp::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.check{width:68px;height:68px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.comp h1{font-size:1.5rem;font-weight:800}
.comp .fam-name{font-size:1.9rem;font-weight:800;color:var(--c);margin:16px 0 10px}
.comp .elist{max-width:360px;margin:0 auto 20px;text-align:left}
.comp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;max-width:360px;margin:0 auto 22px;font-size:.92rem;border-top:1px dashed var(--line);padding-top:16px}
.comp dt{color:var(--muted)}
.comp dd{margin:0;font-weight:600}
.comp .nota{font-size:.88rem;color:var(--muted);margin-bottom:18px}

/* ---------- Panel UTP ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi small{color:var(--muted);font-weight:600;font-size:.85rem}
.kpi b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.estado-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}
.estado-row .det{color:var(--muted);font-size:.92rem}
.estado-row .btn{margin-left:auto}
.famcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:22px}
.famcard{--c:#2442C4;padding:18px;border-top:6px solid var(--c)}
.famcard .big{display:flex;align-items:baseline;gap:6px;margin:6px 0 10px}
.famcard .big b{font-size:2.3rem;font-weight:800;color:var(--c);letter-spacing:-.02em}
.famcard .big span{color:var(--muted);font-weight:600}
.famcard h3{font-weight:800;font-size:1.1rem}
.famcard .el{color:var(--muted);font-size:.86rem;margin:10px 0 14px}
.famcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.lleno-tag{font-size:.75rem;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;padding:.6em .8em}
.toolbar .search{flex:1;min-width:200px}
.toolbar .sp{flex:1}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#F6F7F8;position:sticky;top:0}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#F6F7F8}
.tbl .acc{white-space:nowrap;text-align:right}
.tbl code{font-family:var(--mono);font-weight:700;background:var(--pri-soft);color:var(--pri);padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.chip{--c:#2442C4;display:inline-block;font-weight:700;font-size:.82rem;border-radius:999px;padding:.2em .7em;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);white-space:nowrap}
.chip.none{--c:#6B7278;background:var(--gris-claro)}
.contador{color:var(--muted);font-size:.88rem;padding:10px 14px;border-top:1px solid var(--line2)}
.vacio{padding:40px 20px;text-align:center;color:var(--muted)}
.ok-t{color:var(--ok);font-weight:700}.err-t{color:var(--err);font-weight:700}.warn-t{color:var(--warn);font-weight:700}

.grid2{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.resumen-carga{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.resumen-carga span b{font-size:1.25rem;display:block}

.switch{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;margin-bottom:18px;background:#fff}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .sw{flex:none;width:52px;height:30px;border-radius:99px;background:#C9CED2;position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+.sw{background:var(--ok)}
.switch input:checked+.sw::after{transform:translateX(22px)}
.switch input:focus-visible+.sw{box-shadow:0 0 0 4px var(--pri-soft)}
.switch b{display:block}
.switch small{color:var(--muted)}
.row2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}

.famedit{--c:#2442C4;padding:18px;border-left:6px solid var(--c);margin-bottom:14px}
.famedit .row3{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:700px){.famedit .row3{grid-template-columns:2fr 1fr}}
.famedit .acts{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* ---------- Modal y avisos flotantes ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:rgba(20,24,36,.45);animation:fade .15s}
.modal-card{position:relative;background:#fff;border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 60px -10px rgba(0,0,0,.35);animation:sube .2s ease-out;max-height:calc(100vh - 32px);overflow:auto}
.modal-card h2{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.modal-card .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes sube{from{transform:translateY(14px);opacity:0}}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt small{display:block;color:var(--muted)}
.clave-grande{font-family:var(--mono);font-size:2rem;font-weight:700;letter-spacing:.18em;text-align:center;background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:14px;margin:14px 0}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,440px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);animation:sube .2s}
.toast.err{background:var(--err)}
.toast.ok{background:var(--ok)}

.cargando{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-weight:600}
.cargando .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite;margin:0 auto 12px}

/* ---------- Efectos al pasar el mouse ---------- */
.card,.fam,.famcard,.kpi,.comp,.opt,.chip,.tbl td{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .15s ease,color .15s ease}
.btn{transition:transform .12s ease,background .15s,border-color .15s,box-shadow .18s ease,color .15s}
@media (hover:hover){
  .btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(26,33,50,.28)}
  .btn-pri:not(:disabled):hover{box-shadow:0 8px 18px -6px color-mix(in srgb,var(--pri) 65%,transparent)}
  .btn-ghost:not(:disabled):hover{transform:none;box-shadow:none}
  .fam:not(.lleno):hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(26,33,50,.06),0 18px 36px -14px color-mix(in srgb,var(--c) 45%,rgba(26,33,50,.3));border-color:color-mix(in srgb,var(--c) 35%,#fff)}
  .fam:not(.lleno):hover .elist li i{background:var(--c);color:#fff}
  .fam .btn-pick:not(:disabled):hover{box-shadow:0 8px 18px -6px color-mix(in srgb,var(--c) 70%,transparent)}
  .famcard:hover,.kpi:hover,.famedit:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(26,33,50,.06),0 16px 32px -14px rgba(26,33,50,.28)}
  .seg button:not(.on):hover{color:var(--ink);background:rgba(255,255,255,.55)}
  .tbl tbody tr:hover td{background:var(--pri-soft)}
  .tbl tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
  .opt:not(.dis):hover{border-color:var(--pri);transform:translateX(2px)}
  .switch:hover{border-color:var(--pri)}

<script>
/* ============================================================

// Familias: verde y dorado del liceo, gris pizarra, y otros tonos si se agregan más familias.

const ESTADOS = { abierto: 'Abierta', cerrado: 'Cerrada', programado: 'Programada', finalizado: 'Finalizada' };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }

const S = {
  token: store.get('se_token'), rol: store.get('se_rol'), nombre: store.get('se_nombre') || '',

  colegio: '', loginRol: 'estudiante', tema: { logos: [] }, ap: null,
  est: null, panel: null, tab: 'resumen',

/* ---------- Comunicación con Apps Script ---------- */
function call(accion, datos) {
  return new Promise((resolve, reject) => {
    if (!(window.google && google.script && google.script.run)) {
      reject(new Error('Esta página debe abrirse desde la aplicación web de Apps Script.'));
      return;
    }
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return resolve(r.data);
        const e = new Error(r ? r.error : 'El servidor no respondió.');
        e.code = r && r.code;
        reject(e);
      })
      .withFailureHandler(() => reject(new Error('No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.')))

}

function guardarSesion(r) {
  Object.assign(S, { token: r.token, rol: r.rol, nombre: r.nombre, debeCambiar: !!r.debeCambiar });
  store.set('se_token', r.token); store.set('se_rol', r.rol); store.set('se_nombre', r.nombre);
  store.set('se_cambiar', r.debeCambiar ? '1' : null);
}
function borrarSesion() {
  Object.assign(S, { token: null, rol: null, nombre: '', debeCambiar: false, est: null, panel: null, tab: 'resumen' });
  ['se_token', 'se_rol', 'se_nombre', 'se_cambiar'].forEach((k) => store.set(k, null));
}

function manejarError(e, silencioso) {
  if (e.code === 'SESION') { borrarSesion(); cerrarModal(); vistaLogin(); toast(e.message, 'err'); return; }
  if (e.code === 'CAMBIAR') { S.debeCambiar = true; cerrarModal(); vistaCambio(true); return; }
  if (!silencioso) toast(e.message, 'err');
}

/* XLSX-INICIO — Excel sin librerías externas: escribir (zip sin compresión) y leer (.xlsx de Excel o Google). */
const XLSX = (() => {
  const enc = new TextEncoder();

      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);

      c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), n);

    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true);

      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      `<cols>${cols}</cols><sheetData>${datos}</sheetData>` + (filas.length > 1 ? `<autoFilter ref="${ref}"/>` : '') + '</worksheet>';

        `<Types xmlns="${ns}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>` +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        hojas.map((h, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>' },
      { nombre: '_rels/.rels', texto: DECL +
        `<Relationships xmlns="${ns}/package/2006/relationships"><Relationship Id="rId1" Type="${ns}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { nombre: 'xl/workbook.xml', texto: DECL +
        `<workbook xmlns="${ns}/spreadsheetml/2006/main" xmlns:r="${ns}/officeDocument/2006/relationships"><sheets>` +
        hojas.map((h, i) => `<sheet name="${xml(h.nombre)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets>' +
        (() => {
          const dn = hojas.map((h, i) => h.filas.length > 1
            ? `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xml(h.nombre.replace(/'/g, "''"))}'!$A$1:$${col(Math.max(1, ...h.filas.map((f) => f.length)) - 1)}$${h.filas.length}</definedName>` : '').join('');

        `<Relationships xmlns="${ns}/package/2006/relationships">` +
        hojas.map((h, i) => `<Relationship Id="rId${i + 1}" Type="${ns}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +

        `<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="${color}"/><bgColor indexed="64"/></patternFill></fill></fills>` +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' }
    ].concat(hojas.map((h, i) => ({ nombre: `xl/worksheets/sheet${i + 1}.xml`, texto: hojaXml(h.filas, h.anchos) })));

  }

  /** Lee la primera hoja de un .xlsx → arreglo de filas (texto). */
  async function leer(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
    let e = u8.length - 22;

      const f = dir[nombre]; if (!f) return null;
      const ini = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const datos = u8.subarray(ini, ini + f.tam);
      if (f.metodo === 0) return dec.decode(datos);
      if (typeof DecompressionStream === 'undefined') throw new Error('Tu navegador no puede abrir Excel. Copia y pega las columnas.');
      return new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };

/* XLSX-FIN */

/* ---------- Utilidades ---------- */
function normRut(r) {
  r = String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
  if (r.length < 2) return '';
  const c = r.slice(0, -1).replace(/^0+/, '');
  if (!c || /K/.test(c)) return '';
  return c + '-' + r.slice(-1);
}
function rutValido(rut) {
  const m = /^(\d{1,9})-([\dK])$/.exec(rut);
  if (!m) return false;
  let s = 0, mul = 2;
  for (let i = m[1].length - 1; i >= 0; i--) { s += Number(m[1][i]) * mul; mul = mul === 7 ? 2 : mul + 1; }
  const dv = 11 - (s % 11);
  return (dv === 11 ? '0' : dv === 10 ? 'K' : String(dv)) === m[2];
}
function fmtRut(r) {
  const n = normRut(r); if (!n) return String(r || '');
  const [c, dv] = n.split('-');
  return c.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
}
function fmtFecha(ms) {
  if (!ms) return '';
  return new Date(Number(ms)).toLocaleString('es-CL', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hour12: false }) + ' h';
}
function aInputFecha(ms) {
  if (!ms) return '';
  const d = new Date(Number(ms)), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
/** "Pérez Soto, Ana María" → "Ana"; "Ana Pérez" → "Ana" */
function primerNombre(n) {
  n = String(n || '').trim();
  const parte = n.includes(',') ? n.split(',')[1] : n;
  return (parte.trim().split(/\s+/)[0]) || n;
}
function colorDe(id, familias) {
  const i = (familias || []).findIndex((f) => f.id === id);
  return COLORES[(i < 0 ? 0 : i) % COLORES.length];
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function luminancia(hex) {
  const n = parseInt(String(hex).slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });

}
const tinta = (hex) => (luminancia(hex) > 0.45 ? '#1A2132' : '#FFFFFF');
/** Aplica colores institucionales a toda la interfaz. */
function aplicarTema(t) {
  t = t || {};
  S.tema = Object.assign({ logos: [] }, t, { logos: t.logos || [t.logo1, t.logo2].filter(Boolean) });
  const st = document.documentElement.style;
  const fijar = (k, v) => (v ? st.setProperty(k, v) : st.removeProperty(k));
  fijar('--pri', t.primario); fijar('--pri-ink', t.primario ? tinta(t.primario) : '');
  fijar('--sec', t.secundario); fijar('--sec-ink', t.secundario ? tinta(t.secundario) : '');
}
function pararRefresco() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

function ocupado(btn, on, texto) {
  if (!btn) return;
  if (on) { btn.dataset.txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(texto || 'Procesando…')}`; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}

function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast ' + (tipo || '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 6000 : 3500);
}

function modal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-back" data-act="cerrarModal"></div><div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false; S.modalAbierto = true;
  const f = m.querySelector('input:not([type=radio]):not([type=hidden]),button.btn-pri');
  if (f) setTimeout(() => f.focus(), 30);
}
function cerrarModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; S.modalAbierto = false; }
function confirmar(titulo, texto, { ok = 'Confirmar', peligro = false } = {}) {
  return new Promise((res) => {
    modal(`<h2>${esc(titulo)}</h2><p class="muted">${texto}</p>
      <div class="acts"><button class="btn" data-act="cerrarModal">Cancelar</button>
      <button class="btn ${peligro ? 'btn-danger solid' : 'btn-pri'}" id="mOk">${esc(ok)}</button></div>`);
    $('#mOk').onclick = () => { cerrarModal(); res(true); };
    $$('#modal [data-act=cerrarModal]').forEach((b) => b.addEventListener('click', () => res(false)));
  });
}

function imprimir(html) {
  $('#print-area').innerHTML = html;
  document.body.classList.add('imprimiendo');
  const limpiar = () => { document.body.classList.remove('imprimiendo'); $('#print-area').innerHTML = ''; };
  window.addEventListener('afterprint', limpiar, { once: true });
  setTimeout(() => { try { window.print(); } catch (e) { toast('Tu navegador no permitió imprimir.', 'err'); } setTimeout(limpiar, 1500); }, 60);
}

function descargarExcel(nombre, hojas) {
  const blob = XLSX.crear(hojas, getComputedStyle(document.documentElement).getPropertyValue('--pri').trim() || '#067D3E');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function estudiantesFiltrados() {
  const F = S.filtro, q = F.q.trim().toLowerCase(), qr = normRut(F.q) || F.q.replace(/[^0-9kK]/g, '').toUpperCase();
  return S.panel.estudiantes.filter((e) => {
    if (F.fam === 'SIN' ? e.familia : F.fam && e.familia !== F.fam) return false;
    if (F.curso && e.curso !== F.curso) return false;
    if (!q) return true;
    return e.nombre.toLowerCase().includes(q) || (qr && e.rut.replace('-', '').includes(qr.replace('-', '')));
  }).sort((a, b) => a.curso.localeCompare(b.curso, 'es', { numeric: true }) || a.nombre.localeCompare(b.nombre, 'es'));
}

function renderTabla() {
  const P = S.panel, lista = estudiantesFiltrados(), fams = P.familias;
  const nom = Object.fromEntries(fams.map((f) => [f.id, f.nombre]));
  const el = $('#tabla'); if (!el) return;
  if (!P.estudiantes.length) {
    el.innerHTML = `<div class="vacio">Todavía no hay estudiantes cargados.<br><br><button class="btn btn-pri" data-act="tab" data-tab="cargar">Cargar lista</button></div>`;
    return;
  }
  const existe = new Set(P.estudiantes.map((e) => e.rut));
  S.sel.forEach((r) => { if (!existe.has(r)) S.sel.delete(r); });
  const visibles = lista.slice(0, 500);
  const nSelVis = visibles.filter((e) => S.sel.has(e.rut)).length;
  const filas = visibles.map((e) => `<tr data-rut="${esc(e.rut)}" class="${S.sel.has(e.rut) ? 'sel' : ''}">
    <td class="ck"><input type="checkbox" data-sel="${esc(e.rut)}" ${S.sel.has(e.rut) ? 'checked' : ''} aria-label="Seleccionar ${esc(e.nombre)}"></td>

function parsearCarga(texto) {
  const filas = [];
  texto.split(/\r?\n/).forEach((linea, i) => {
    if (!linea.trim()) return;
    const sep = linea.includes('\t') ? '\t' : linea.includes(';') ? ';' : ',';
    const c = linea.split(sep).map((x) => x.trim().replace(/^"(.*)"$/, '$1').trim());
    while (c.length && c[c.length - 1] === '') c.pop();
    if (!filas.length && /ru[tn]/i.test(c[0] || '') && !normRut(c[0])) return; // títulos
    if (/^[\d.]+$/.test(c[0] || '') && /^[\dkK]$/.test(c[1] || '') && c.length >= 3) c.splice(0, 2, c[0] + '-' + c[1]); // RUN y DV separados
    let rut = c[0] || '', nombre = '', curso = '';
    if (c.length === 2) nombre = c[1];
    else if (c.length >= 3) { nombre = c.slice(1, -1).join(' '); curso = c[c.length - 1]; }
    filas.push({ rut, nombre: nombre.replace(/\s+/g, ' ').trim(), curso });
  });
  return filas;
}

/** Reduce la imagen (máx. 320 px) para guardarla dentro de la planilla. */
function procesarLogo(archivo) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(archivo), img = new Image();
    img.onload = () => {
      let max = 320;
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, max / Math.max(img.naturalWidth || 300, img.naturalHeight || 300));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.naturalWidth || 300) * k)); c.height = Math.max(1, Math.round((img.naturalHeight || 300) * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let d = c.toDataURL('image/webp', 0.9);
        if (!d.startsWith('data:image/webp')) d = c.toDataURL('image/png');
        if (d.length < 45000) { URL.revokeObjectURL(url); return res(d); }
        max = Math.round(max * 0.75);
      }
      rej(new Error('La imagen es demasiado pesada.'));
    };
    img.onerror = () => rej(new Error('No se pudo leer la imagen.'));
    img.src = url;
  });
}

/** Colores más presentes del logo (ignora fondo blanco, negro y transparencias). */
function coloresDeImagen(src) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 80 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data, cubos = {};
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        if (a < 200 || (mn > 222) || mx < 28 || (mx - mn < 14 && mx > 190)) continue;
        const key = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
        const e = cubos[key] || (cubos[key] = { n: 0, r: 0, g: 0, b: 0 });
        e.n++; e.r += r; e.g += g; e.b += b;
      }
      const hex = (v) => Math.round(v).toString(16).padStart(2, '0');
      const lista = Object.values(cubos).sort((a, b) => b.n - a.n).map((e) => '#' + hex(e.r / e.n) + hex(e.g / e.n) + hex(e.b / e.n));
      const dist = (a, b) => { const p = (h, i) => parseInt(h.substr(1 + i * 2, 2), 16); return Math.hypot(p(a, 0) - p(b, 0), p(a, 1) - p(b, 1), p(a, 2) - p(b, 2)); };
      const out = [];
      for (const h of lista) { if (out.every((o) => dist(o, h) > 70)) out.push(h.toUpperCase()); if (out.length >= 6) break; }
      res(out);
    };
    img.onerror = () => res([]);
    img.src = src;
  });
}

  const ruts = [...S.sel], n = ruts.length; if (!n) return;
  const f = familia && S.panel.familias.find((x) => x.id === familia);
  const txt = {
    asignar: [`¿Asignar ${n} estudiante${n === 1 ? '' : 's'} a ${f && esc(f.nombre)}?`, `Quedan ${f && f.libres} cupos en esa familia. Si no alcanzan, se asignan en orden y el resto queda como está.`, 'Asignar'],

    restablecer: [`¿Restablecer la clave de ${n} estudiante${n === 1 ? '' : 's'}?`, 'Su clave vuelve a ser los últimos 4 dígitos de su RUT.', 'Restablecer'],
    eliminar: [`¿Eliminar ${n} estudiante${n === 1 ? '' : 's'}?`, 'Se borran de la lista y se liberan sus cupos. <b>Esto no se puede deshacer.</b>', 'Eliminar']
  }[accion];
  if (!(await confirmar(txt[0], txt[1], { ok: txt[2], peligro: accion === 'eliminar' }))) { renderTabla(); return; }
  try {
    const r = await call('masivo', { accion, ruts, familia: familia || '' });

 * ============================================================ */
const ACT = {
  rol(b) { S.loginRol = b.dataset.rol; vistaLogin(); },
  verClave(b) { const i = b.parentElement.querySelector('input'); const v = i.type === 'password'; i.type = v ? 'text' : 'password'; b.textContent = v ? 'Ocultar' : 'Ver'; },
  cerrarModal() { cerrarModal(); },
  salir() { if (S.token) call('logout').catch(() => {}); borrarSesion(); cerrarModal(); vistaLogin(); },
  reintentar() { entrar(); },
  claveModal() {
    modal(`<h2>Cambiar mi clave</h2><form data-form="clave" novalidate>${formClave(false)}
      <div class="acts"><button type="button" class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-pri" type="submit">Guardar</button></div></form>`);
  },

  /* Estudiante */
  elegir(b) {
    const f = S.est.familias.find((x) => x.id === b.dataset.id); if (!f) return;
    const c = colorDe(f.id, S.est.familias);
    modal(`<h2>¿Confirmas ${esc(f.nombre)}?</h2>
      <ul class="elist" style="--c:${c};margin:16px 0">${f.electivos.map((e, i) => `<li><i>${i + 1}</i><span>${esc(e)}</span></li>`).join('')}</ul>
      <p class="muted">Tu elección es <b>definitiva</b>. Solo la UTP puede cambiarla después.</p>
      <div class="acts"><button class="btn" data-act="cerrarModal">Volver</button>
      <button class="btn btn-pri" data-act="inscribir" data-id="${esc(f.id)}" style="background:${c};border-color:${c}">Confirmar inscripción</button></div>`);
  },
  async inscribir(b) {
    ocupado(b, true, 'Inscribiendo…');
    try {
      S.est = await call('inscribir', { familia: b.dataset.id });
      cerrarModal(); vistaEstudiante(); window.scrollTo(0, 0);
    } catch (e) {
      cerrarModal(); manejarError(e);
      if (e.code === 'LLENO' || e.code === 'YA' || e.code === 'CERRADO') { S.modalAbierto = false; refrescarEstudiante(); }
    }
  },
  imprimirComp() { imprimir(comprobanteHTML(S.est.estudiante, S.est.familias, true)); },

  /* UTP */
  tab(b) {
    if (S.tab === 'apariencia' && b.dataset.tab !== 'apariencia') aplicarTema(S.panel.tema); // descarta la vista previa sin guardar
    if (b.dataset.tab === 'apariencia') S.ap = Object.assign({}, { primario: '', secundario: '', logo1: '', logo2: '' }, S.panel.tema, { sugeridos: [] });
    S.tab = b.dataset.tab; vistaPanel(); window.scrollTo(0, 0);
  },
  async refrescar(b) { ocupado(b, true, 'Actualizando…'); await recargarPanel(); ocupado(b, false); },
  verFam(b) { S.filtro = { q: '', fam: b.dataset.id, curso: '' }; S.tab = 'estudiantes'; vistaPanel(); },
  excelFam(b) {
    const id = b.dataset.id, P = S.panel, E = P.estudiantes;
    if (!id) {
      descargarExcel(nombreArchivo('Inscripciones_electivos'), [hojaResumen(), hojaGeneral('Todas', E)]
        .concat(P.familias.map((f) => hojaFamilia(f, E.filter((e) => e.familia === f.id))), [hojaFamilia(null, E.filter((e) => !e.familia))]));
    } else if (id === 'SIN') {
      descargarExcel(nombreArchivo('Sin_inscribir'), [hojaFamilia(null, E.filter((e) => !e.familia))]);
    } else {
      const f = P.familias.find((x) => x.id === id);
      descargarExcel(nombreArchivo(f.nombre), [hojaFamilia(f, E.filter((e) => e.familia === id))]);
    }
  },
  excelLista() { descargarExcel(nombreArchivo('Estudiantes'), [hojaGeneral('Estudiantes', estudiantesFiltrados())]); },
  plantillaExcel() {
    descargarExcel('plantilla-estudiantes.xlsx', [{ nombre: 'Estudiantes', anchos: [16, 36, 18],
      filas: [['RUT', 'Nombre', 'Curso'], ['12.345.678-5', 'Pérez Soto, Ana María', '2° Medio Ayun'], ['11.111.111-1', 'Rojas Díaz, Benjamín', '2° Medio Ayun']] }]);
  },
  async exportarHoja(b) {
    ocupado(b, true, 'Preparando…');
    try {
      const r = await call('exportarHoja', { familia: b.dataset.id || '' });
      modal(`<h2>Exportación lista</h2><p class="muted">Se copiaron ${r.filas} filas a la hoja <b>Exportación</b> de la planilla.</p>
        <div class="acts"><button class="btn" data-act="cerrarModal">Cerrar</button><a class="btn btn-pri" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir planilla</a></div>`);
    } catch (e) { manejarError(e); }
    ocupado(b, false);
  },
  fichas() {
    const lista = estudiantesFiltrados().filter((e) => e.claveInicial);
    if (!lista.length) { toast('Todos los estudiantes de esta lista ya crearon una clave personal.'); return; }
    imprimir(fichasHTML(lista));
  },
  asignar(b) {
    const P = S.panel, e = P.estudiantes.find((x) => x.rut === b.dataset.rut); if (!e) return;
    const opts = P.familias.map((f) => {
      const actual = e.familia === f.id, dis = !actual && f.libres <= 0;
      return `<label class="opt ${dis ? 'dis' : ''}"><input type="radio" name="fam" value="${esc(f.id)}" ${actual ? 'checked' : ''} ${dis ? 'disabled' : ''}>
        <span><b>${esc(f.nombre)}</b><small>${actual ? 'Familia actual' : f.libres <= 0 ? 'Sin cupos' : f.libres + ' cupos libres'} · ${f.electivos.map(esc).join(', ')}</small></span></label>`;
    }).join('');
    modal(`<h2>Familia de ${esc(primerNombre(e.nombre))}</h2><p class="muted">${esc(e.nombre)} · ${esc(fmtRut(e.rut))} · ${esc(e.curso)}</p>
      <form data-form="asignar" data-rut="${esc(e.rut)}"><div class="opts">${opts}
        <label class="opt"><input type="radio" name="fam" value="" ${e.familia ? '' : 'checked'}><span><b>Sin familia</b><small>${e.familia ? 'Quita la inscripción y libera el cupo' : 'Estado actual'}</small></span></label></div>
        <div class="acts"><button type="button" class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-pri" type="submit">Guardar</button></div></form>`);
  },
  async resetClave(b) {
    const e = S.panel.estudiantes.find((x) => x.rut === b.dataset.rut); if (!e) return;
    if (!(await confirmar('¿Restablecer clave?', `La clave de ${esc(e.nombre)} volverá a ser los últimos 4 dígitos de su RUT. Si había creado una clave personal, deja de funcionar.`, { ok: 'Restablecer' }))) return;
    try {
      const r = await call('restablecerClave', { rut: e.rut });
      e.claveInicial = r.clave;
      modal(`<h2>Clave restablecida</h2><p class="muted">${esc(e.nombre)} · ${esc(fmtRut(e.rut))}</p>
        <div class="clave-grande">${esc(r.clave)}</div><p class="hint">Son los últimos 4 dígitos de su RUT.</p>
        <div class="acts"><button class="btn" data-act="fichaUna" data-rut="${esc(e.rut)}">Imprimir ficha</button><button class="btn btn-pri" data-act="cerrarModal">Listo</button></div>`);
      if (S.tab === 'estudiantes') renderTabla();
    } catch (err) { manejarError(err); }
  },
  fichaUna(b) { const e = S.panel.estudiantes.find((x) => x.rut === b.dataset.rut); cerrarModal(); if (e) imprimir(fichasHTML([e])); },
  async eliminarEst(b) {
    const e = S.panel.estudiantes.find((x) => x.rut === b.dataset.rut); if (!e) return;
    if (!(await confirmar('¿Eliminar estudiante?', `Se borrará a <b>${esc(e.nombre)}</b> (${esc(fmtRut(e.rut))}) de la lista${e.familia ? ' y se liberará su cupo' : ''}. Esto no se puede deshacer.`, { ok: 'Eliminar', peligro: true }))) return;
    try { await call('eliminarEstudiante', { rut: e.rut }); toast('Estudiante eliminado.', 'ok'); await recargarPanel(); }
    catch (err) { manejarError(err); }
  },
  limpiarCarga() { S.carga = { texto: '', filas: [] }; $('#txtCarga').value = ''; renderPrevia(); },
  async importar(b) {
    const filas = S.carga.filas;
    ocupado(b, true, 'Guardando…');
    try {
      const r = await call('importar', { filas });
      S.carga = { texto: '', filas: [] };
      S.panel = await call('panel');
      vistaPanel();
      modal(`<h2>Lista cargada</h2>
        <div class="resumen-carga"><span><b class="ok-t">${r.nuevos}</b>nuevos</span><span><b class="warn-t">${r.actualizados}</b>actualizados</span>
        <span><b>${r.sinCambios}</b>sin cambios</span><span><b class="err-t">${r.errores.length}</b>con error</span></div>
        ${r.errores.length ? `<p class="hint">No se cargaron: ${r.errores.slice(0, 8).map((x) => `línea ${x.linea} (${esc(x.motivo)})`).join(', ')}${r.errores.length > 8 ? '…' : ''}</p>` : ''}
        <p class="muted" style="margin-top:12px">Ya pueden entrar con su RUT y, como clave, los últimos 4 dígitos de su RUT. Si quieres, imprime fichas de acceso desde Estudiantes.</p>
        <div class="acts"><button class="btn" data-act="cerrarModal">Cerrar</button><button class="btn btn-pri" data-act="irFichas">Ir a Estudiantes</button></div>`);
    } catch (e) { manejarError(e); ocupado(b, false); }
  },
  quitarLogo(b) { S.ap['logo' + b.dataset.i] = ''; if (b.dataset.i === '1') S.ap.sugeridos = []; vistaPreviaTema(); vistaPanel(); },
  async colorLogo(b) {
    ocupado(b, true, 'Analizando…');
    S.ap.sugeridos = await coloresDeImagen(S.ap.logo1);
    if (!S.ap.sugeridos.length) toast('No encontré colores claros en el logo. Elígelos a mano.');
    vistaPanel();
  },
  usarColor(b, e) { S.ap[e.shiftKey ? 'secundario' : 'primario'] = b.dataset.c; vistaPreviaTema(); vistaPanel(); },
  aparienciaOriginal() { const L = S.panel.tema.liceo || {}; S.ap.primario = L.primario || ''; S.ap.secundario = L.secundario || ''; vistaPreviaTema(); vistaPanel(); },
  async guardarApariencia(b) {
    ocupado(b, true, 'Guardando…');
    try {
      const t = await call('guardarApariencia', { primario: S.ap.primario, secundario: S.ap.secundario, logo1: S.ap.logo1, logo2: S.ap.logo2 });
      S.panel.tema = t; aplicarTema(t); toast('Apariencia guardada. Ya la ven todos.', 'ok'); vistaPanel();
    } catch (e) { manejarError(e); ocupado(b, false); }
  },
  selTodos() { estudiantesFiltrados().forEach((e) => S.sel.add(e.rut)); renderTabla(); },
  selLimpiar() { S.sel.clear(); renderTabla(); },
  selExcel() { descargarExcel(nombreArchivo('Seleccionados'), [hojaGeneral('Seleccionados', S.panel.estudiantes.filter((e) => S.sel.has(e.rut)))]); },
  selFichas() {
    const lista = ordenarParaExportar(S.panel.estudiantes.filter((e) => S.sel.has(e.rut) && e.claveInicial));
    if (!lista.length) { toast('Los seleccionados ya crearon una clave personal.'); return; }
    imprimir(fichasHTML(lista));
  },
  async selMasivo(b) { await accionMasiva(b.dataset.accion); },
  irFichas() { cerrarModal(); S.filtro = { q: '', fam: '', curso: '' }; S.tab = 'estudiantes'; vistaPanel(); },
  async agregarFam(b) {
    ocupado(b, true, 'Agregando…');
    try { await call('agregarFamilia'); await recargarPanel(); toast('Familia agregada. Completa sus datos y guarda.', 'ok'); }
    catch (e) { manejarError(e); ocupado(b, false); }
  },
  async eliminarFam(b) {
    const f = S.panel.familias.find((x) => x.id === b.dataset.id); if (!f) return;
    if (!(await confirmar('¿Eliminar familia?', `Se eliminará <b>${esc(f.nombre)}</b>. Los estudiantes ya no podrán elegirla.`, { ok: 'Eliminar', peligro: true }))) return;
    try { await call('eliminarFamilia', { id: f.id }); toast('Familia eliminada.', 'ok'); await recargarPanel(); }
    catch (e) { manejarError(e); }
  }
};

/* ============================================================
 *  FORMULARIOS
 * ============================================================ */
const FORMS = {
  async login(f) {
    const d = Object.fromEntries(new FormData(f)), err = $('#err'), btn = f.querySelector('[type=submit]');
    err.textContent = '';
    if (S.loginRol === 'estudiante') {
      const r = normRut(d.usuario);
      if (!r || !rutValido(r)) { err.textContent = 'Revisa tu RUT: el dígito verificador no coincide.'; return; }
    }
    if (!d.clave) { err.textContent = 'Escribe tu clave.'; return; }
    ocupado(btn, true, 'Entrando…');
    try {
      const r = await call('login', { rol: S.loginRol, usuario: d.usuario, clave: d.clave });
      guardarSesion(r);
      r.debeCambiar ? vistaCambio(true) : entrar();
    } catch (e) { err.textContent = e.message; ocupado(btn, false); }
  },
  async clave(f) {
    const d = Object.fromEntries(new FormData(f)), err = $('#errClave'), btn = f.querySelector('[type=submit]');
    err.textContent = '';
    if ((d.nueva || '').length < 6) { err.textContent = 'La nueva clave debe tener al menos 6 caracteres.'; return; }
    if (d.nueva !== d.repetir) { err.textContent = 'Las claves no coinciden.'; return; }
    ocupado(btn, true, 'Guardando…');
    try {
      await call('cambiarClave', { actual: d.actual || '', nueva: d.nueva });
      S.debeCambiar = false; store.set('se_cambiar', null);
      cerrarModal(); toast('Clave guardada.', 'ok');
      if (d.forzado) entrar();
      else ocupado(btn, false);
    } catch (e) {
      if (e.code === 'SESION') return manejarError(e);
      err.textContent = e.message; ocupado(btn, false);
    }
  },
  async proceso(f) {
    const d = Object.fromEntries(new FormData(f)), err = $('#errProceso'), btn = f.querySelector('[type=submit]');
    err.textContent = '';
    const ms = (v) => (v ? new Date(v).getTime() : 0);
    ocupado(btn, true, 'Guardando…');
    try {
      await call('guardarProceso', { abierto: !!d.abierto, apertura: ms(d.apertura), cierre: ms(d.cierre), colegio: d.colegio, enlace: d.enlace });
      S.panel = await call('panel'); vistaPanel(); toast('Cambios guardados.', 'ok');
    } catch (e) { if (e.code === 'SESION') return manejarError(e); err.textContent = e.message; ocupado(btn, false); }
  },
  async familia(f) {
    const d = Object.fromEntries(new FormData(f)), btn = f.querySelector('[type=submit]');
    ocupado(btn, true, 'Guardando…');
    try {
      await call('guardarFamilia', { id: f.dataset.id, nombre: d.nombre, cupo: d.cupo, electivos: d.electivos.split('\n') });
      toast('Familia guardada.', 'ok'); await recargarPanel();
    } catch (e) { manejarError(e); ocupado(btn, false); }
  },
  async asignar(f) {
    const fam = (new FormData(f)).get('fam') || '', btn = f.querySelector('[type=submit]');
    ocupado(btn, true, 'Guardando…');
    try {
      await call('asignar', { rut: f.dataset.rut, familia: fam });
      cerrarModal(); toast(fam ? 'Familia asignada.' : 'Inscripción quitada.', 'ok'); await recargarPanel();
    } catch (e) { manejarError(e); ocupado(btn, false); }
  }
};

/* ============================================================
 *  EVENTOS
 * ============================================================ */
document.addEventListener('click', (e) => {
  const fila = e.target.closest('#tabla tr[data-rut]');
  if (fila && !e.target.closest('button,input,select,a,label')) {
    const r = fila.dataset.rut; S.sel.has(r) ? S.sel.delete(r) : S.sel.add(r); renderTabla(); return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});
const filtrar = debounce(() => renderTabla(), 120);
const previa = debounce(() => { S.carga.filas = parsearCarga(S.carga.texto); renderPrevia(); }, 200);
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.filtro) { S.filtro[t.dataset.filtro] = t.value; filtrar(); }
  if (t.id === 'txtCarga') { S.carga.texto = t.value; previa(); }
  if (t.dataset.color) { S.ap[t.dataset.color] = t.value.toUpperCase(); const tx = $(`[data-colortxt=${t.dataset.color}]`); if (tx) tx.value = t.value.toUpperCase(); vistaPreviaTema(); }
  if (t.dataset.colortxt) {
    let v = t.value.trim(); if (v && v[0] !== '#') v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { S.ap[t.dataset.colortxt] = v.toUpperCase(); const c = $(`[data-color=${t.dataset.colortxt}]`); if (c) c.value = v; vistaPreviaTema(); }
    else if (!v) { S.ap[t.dataset.colortxt] = ''; vistaPreviaTema(); }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  // Solo selects: en el buscador "change" llega al perder el foco y redibujar ahí anularía el clic en la tabla.
  if (t.dataset.filtro && t.tagName === 'SELECT') { S.filtro[t.dataset.filtro] = t.value; renderTabla(); }
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); renderTabla(); }
  if (t.id === 'selTodos') { estudiantesFiltrados().slice(0, 500).forEach((e) => (t.checked ? S.sel.add(e.rut) : S.sel.delete(e.rut))); renderTabla(); }
  if (t.id === 'selFam' && t.value) accionMasiva('asignar', t.value);
  if (t.dataset.logo && t.files[0]) {
    const i = t.dataset.logo;
    procesarLogo(t.files[0]).then(async (d) => {
      S.ap['logo' + i] = d;
      if (i === '1') {
        S.ap.sugeridos = await coloresDeImagen(d);
        if (S.ap.sugeridos.length && !S.ap.primario) { S.ap.primario = S.ap.sugeridos[0]; S.ap.secundario = S.ap.secundario || S.ap.sugeridos[1] || ''; }
      }
      vistaPreviaTema(); vistaPanel();
    }).catch((e) => { const el = $('#errAp'); if (el) el.textContent = e.message; });
  }
  if (t.id === 'archivoCsv' && t.files[0]) {
    const archivo = t.files[0];
    const cargar = (txt) => { S.carga.texto = txt.replace(/^\ufeff/, ''); $('#txtCarga').value = S.carga.texto; S.carga.filas = parsearCarga(S.carga.texto); renderPrevia(); t.value = ''; };
    if (/\.xlsx$/i.test(archivo.name)) {
      archivo.arrayBuffer().then(XLSX.leer).then((filas) => cargar(filas.map((f) => f.map((v) => String(v).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n')))
        .catch((e) => toast(e.message || 'No se pudo leer el Excel.', 'err'));
    } else {
      const leer = (enc) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(archivo, enc); });
      leer('utf-8').then((txt) => (txt.includes('\uFFFD') ? leer('windows-1252') : txt)).then(cargar);
    }
  }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-rut') && normRut(t.value)) t.value = fmtRut(t.value);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modalAbierto) cerrarModal(); });

/* ============================================================
 *  INICIO
 * ============================================================ */
(async function iniciar() {
  try { const p = await call('publico'); S.colegio = p.colegio; aplicarTema(p.tema); } catch (e) {}
  if (!S.token) return vistaLogin();
  if (S.debeCambiar) return vistaCambio(true);
  entrar();
})();
</script>
