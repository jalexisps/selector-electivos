<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de Electivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#1A2132; --muted:#5D6577; --soft:#8A90A0; --line:#E2DDD2; --line2:#EEEAE2;
  --pri:#2442C4; --pri-ink:#fff; --pri-soft:#E8ECFB;
  --ok:#17845A; --ok-soft:#E3F4EC; --warn:#B86E00; --warn-soft:#FBF0DD; --err:#C0353F; --err-soft:#FBE7E8;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(26,33,50,.06),0 6px 20px -8px rgba(26,33,50,.12);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid transparent;border-radius:var(--r-sm);padding:.7em 1.15em;font-weight:700;cursor:pointer;background:#fff;border-color:var(--line);transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#cfc8ba}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn-pri:hover{background:#1c37a8;border-color:#1c37a8}
.btn-danger{color:var(--err)}
.btn-danger.solid{background:var(--err);color:#fff;border-color:var(--err)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(26,33,50,.06);border-color:transparent;color:var(--ink)}
.btn-sm{padding:.45em .8em;font-size:.9rem;border-radius:8px}
.btn-block{width:100%}
.btn .spin{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- Formularios ---------- */
label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:14px}
label.f>span{display:block;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:.72em .85em;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
textarea.inp{resize:vertical;min-height:120px;font-family:var(--mono);font-size:.88rem;line-height:1.5}
.pw{position:relative}
.pw .inp{padding-right:4.2em}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-weight:700;font-size:.82rem;cursor:pointer;padding:.4em .6em;border-radius:6px}
.pw button:hover{background:var(--line2)}
.form-err{color:var(--err);font-weight:600;font-size:.92rem;min-height:1.3em;margin:-4px 0 10px}
.hint{color:var(--muted);font-size:.9rem}

/* ---------- Marca ---------- */
.marca{width:36px;height:36px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font-weight:800;font-size:1rem;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;
  background:
    radial-gradient(1200px 500px at 110% -10%,rgba(36,66,196,.10),transparent 60%),
    radial-gradient(900px 500px at -20% 110%,rgba(14,124,123,.10),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:410px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:30px 26px 24px;border:1px solid var(--line2)}
.login-card .marca{width:46px;height:46px;margin-bottom:14px}
.login-card h1{font-size:1.65rem;font-weight:800}
.login-card .colegio{color:var(--muted);margin-top:4px;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line2);border-radius:12px;padding:4px;margin:22px 0 20px}
.seg button{border:0;background:none;padding:.6em;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.login-card .hint{margin-top:16px;text-align:center}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.top-user{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-user .quien{font-weight:600;font-size:.92rem;margin-right:6px;text-align:right;line-height:1.2}
.top-user .quien small{display:block;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:.65em .9em;font-weight:700;color:var(--muted);cursor:pointer;border-radius:9px;white-space:nowrap;position:relative}
.tabs button:hover{color:var(--ink);background:rgba(26,33,50,.05)}
.tabs button.on{color:var(--pri)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:3px;border-radius:3px;background:var(--pri)}
@media(min-width:900px){.tabs{order:0;width:auto;margin:0 0 0 18px}}
@media(max-width:1380px){.top-panel .quien{display:none}}
@media(max-width:560px){.brand>div{display:none}.top-in{flex-wrap:nowrap}.top-panel .top-in{flex-wrap:wrap}.top-user .quien{font-size:.86rem}}

.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
.wrap-narrow{max-width:880px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:1.45rem;font-weight:800}
.sec-head p{color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}

/* ---------- Avisos ---------- */
.banner{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r);padding:16px 18px;margin-bottom:20px;border:1px solid}
.banner .ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.banner h3{font-size:1.05rem;font-weight:800}
.banner p{margin-top:2px;color:var(--muted)}
.banner.ok{background:var(--ok-soft);border-color:#bfe4d1}.banner.ok .ico{background:var(--ok)}
.banner.warn{background:var(--warn-soft);border-color:#f0d7ae}.banner.warn .ico{background:var(--warn)}
.banner.off{background:#ECE9E2;border-color:var(--line)}.banner.off .ico{background:var(--soft)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:.25em .7em;font-weight:700;font-size:.82rem}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.abierto{background:var(--ok-soft);color:var(--ok)}
.pill.programado{background:var(--warn-soft);color:var(--warn)}
.pill.cerrado,.pill.finalizado{background:#E9E6DF;color:var(--muted)}

/* ---------- Familias (estudiante) ---------- */
.saludo{margin:6px 0 18px}
.saludo h1{font-size:1.6rem;font-weight:800}
.saludo p{color:var(--muted);margin-top:4px}
.fams{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.fam{--c:#2442C4;background:var(--card);border-radius:18px;border:1px solid var(--line2);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;position:relative}
.fam::before{content:"";height:7px;background:var(--c)}
.fam-body{padding:18px 18px 16px;display:flex;flex-direction:column;flex:1}
.fam-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.fam-head h3{font-size:1.25rem;font-weight:800;color:var(--c)}
.cupo-tag{font-weight:700;font-size:.8rem;border-radius:999px;padding:.25em .65em;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);white-space:nowrap}
.cupo-tag.poco{background:var(--warn-soft);color:var(--warn)}
.cupo-tag.lleno{background:#E9E6DF;color:var(--muted)}
.elist{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px;flex:1}
.elist li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.elist li i{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:.78rem;font-weight:800;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-top:-1px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .5s}
.cupo-txt{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin:7px 0 14px}
.fam .btn-pick{background:var(--c);border-color:var(--c);color:#fff;width:100%}
.fam .btn-pick:hover{filter:brightness(.93)}
.fam.lleno{opacity:.72}
.fam.lleno::after{content:"Completa";position:absolute;top:18px;right:-34px;transform:rotate(35deg);background:var(--ink);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 40px}
.fam.lleno .cupo-tag{visibility:hidden}

/* ---------- Comprobante ---------- */
.comp{max-width:560px;margin:10px auto 0;text-align:center;padding:34px 26px 26px;border-radius:22px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--line2);position:relative;overflow:hidden}
.comp::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.check{width:68px;height:68px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.comp h1{font-size:1.5rem;font-weight:800}
.comp .fam-name{font-size:1.9rem;font-weight:800;color:var(--c);margin:16px 0 10px}
.comp .elist{max-width:360px;margin:0 auto 20px;text-align:left}
.comp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;max-width:360px;margin:0 auto 22px;font-size:.92rem;border-top:1px dashed var(--line);padding-top:16px}
.comp dt{color:var(--muted)}
.comp dd{margin:0;font-weight:600}
.comp .nota{font-size:.88rem;color:var(--muted);margin-bottom:18px}

/* ---------- Panel UTP ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi small{color:var(--muted);font-weight:600;font-size:.85rem}
.kpi b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.estado-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}
.estado-row .det{color:var(--muted);font-size:.92rem}
.estado-row .btn{margin-left:auto}
.famcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:22px}
.famcard{--c:#2442C4;padding:18px;border-top:6px solid var(--c)}
.famcard .big{display:flex;align-items:baseline;gap:6px;margin:6px 0 10px}
.famcard .big b{font-size:2.3rem;font-weight:800;color:var(--c);letter-spacing:-.02em}
.famcard .big span{color:var(--muted);font-weight:600}
.famcard h3{font-weight:800;font-size:1.1rem}
.famcard .el{color:var(--muted);font-size:.86rem;margin:10px 0 14px}
.famcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.lleno-tag{font-size:.75rem;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;padding:.6em .8em}
.toolbar .search{flex:1;min-width:200px}
.toolbar .sp{flex:1}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFAF7;position:sticky;top:0}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#FBFAF7}
.tbl .acc{white-space:nowrap;text-align:right}
.tbl code{font-family:var(--mono);font-weight:700;background:var(--pri-soft);color:var(--pri);padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.chip{--c:#2442C4;display:inline-block;font-weight:700;font-size:.82rem;border-radius:999px;padding:.2em .7em;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);white-space:nowrap}
.chip.none{--c:#8A90A0;background:#EEEBE4}
.contador{color:var(--muted);font-size:.88rem;padding:10px 14px;border-top:1px solid var(--line2)}
.vacio{padding:40px 20px;text-align:center;color:var(--muted)}
.ok-t{color:var(--ok);font-weight:700}.err-t{color:var(--err);font-weight:700}.warn-t{color:var(--warn);font-weight:700}

.grid2{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:1.25fr 1fr}}
.resumen-carga{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.resumen-carga span b{font-size:1.25rem;display:block}

.switch{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;margin-bottom:18px;background:#fff}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .sw{flex:none;width:52px;height:30px;border-radius:99px;background:#D6D1C6;position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+.sw{background:var(--ok)}
.switch input:checked+.sw::after{transform:translateX(22px)}
.switch input:focus-visible+.sw{box-shadow:0 0 0 4px var(--pri-soft)}
.switch b{display:block}
.switch small{color:var(--muted)}
.row2{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:600px){.row2{grid-template-columns:1fr 1fr}}

.famedit{--c:#2442C4;padding:18px;border-left:6px solid var(--c);margin-bottom:14px}
.famedit .row3{display:grid;gap:0 14px;grid-template-columns:1fr}
@media(min-width:700px){.famedit .row3{grid-template-columns:2fr 1fr}}
.famedit .acts{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* ---------- Modal y avisos flotantes ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal-back{position:absolute;inset:0;background:rgba(20,24,36,.45);animation:fade .15s}
.modal-card{position:relative;background:#fff;border-radius:20px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 60px -10px rgba(0,0,0,.35);animation:sube .2s ease-out;max-height:calc(100vh - 32px);overflow:auto}
.modal-card h2{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.modal-card .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes sube{from{transform:translateY(14px);opacity:0}}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt small{display:block;color:var(--muted)}
.clave-grande{font-family:var(--mono);font-size:2rem;font-weight:700;letter-spacing:.18em;text-align:center;background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:14px;margin:14px 0}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,440px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);animation:sube .2s}
.toast.err{background:var(--err)}
.toast.ok{background:var(--ok)}

.cargando{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-weight:600}
.cargando .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite;margin:0 auto 12px}

/* ---------- Impresión ---------- */
#print-area{display:none}
@media print{
  body.imprimiendo>*:not(#print-area){display:none!important}
  body.imprimiendo #print-area{display:block}
  body{background:#fff}
  .fichas{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .ficha{border:1px dashed #999;padding:14px 16px;break-inside:avoid;font-size:12px}
  .ficha .ft{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px}
  .ficha .ft svg{width:20px;height:20px}
  .ficha .ft small{color:#666;margin-left:auto;text-align:right}
  .ficha .fn{font-size:15px;font-weight:800}
  .ficha dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0}
  .ficha dt{color:#666}.ficha dd{margin:0;font-weight:700}
  .ficha .cl{font-family:var(--mono);font-size:17px;letter-spacing:.15em}
  .ficha p{color:#555;font-size:10.5px}
  .comp{box-shadow:none;border:1px solid #ccc}
  .comp .no-print{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="cargando"><div><div class="spin"></div>Cargando…</div></div></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
/* ============================================================
 *  SELECTOR DE ELECTIVOS — Interfaz
 * ============================================================ */
const COLORES = ['#0E7C7B', '#D1495B', '#5B4BC4', '#D98200', '#2E7D32', '#1565C0', '#8E3B9E', '#6D4C41'];
const ESTADOS = { abierto: 'Abierta', cerrado: 'Cerrada', programado: 'Programada', finalizado: 'Finalizada' };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
};

const S = {
  token: store.get('se_token'), rol: store.get('se_rol'), nombre: store.get('se_nombre') || '',
  debeCambiar: store.get('se_cambiar') === '1',
  colegio: '', loginRol: 'estudiante',
  est: null, panel: null, tab: 'resumen',
  filtro: { q: '', fam: '', curso: '' },
  carga: { texto: '', filas: [] },
  timer: null, modalAbierto: false
};

/* ---------- Comunicación con Apps Script ---------- */
function call(accion, datos) {
  return new Promise((resolve, reject) => {
    if (!(window.google && google.script && google.script.run)) {
      reject(new Error('Esta página debe abrirse desde la aplicación web de Apps Script.'));
      return;
    }
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return resolve(r.data);
        const e = new Error(r ? r.error : 'El servidor no respondió.');
        e.code = r && r.code;
        reject(e);
      })
      .withFailureHandler(() => reject(new Error('No se pudo conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.')))
      .api({ accion, token: S.token || '', datos: datos || {} });
  });
}

function guardarSesion(r) {

/* ---------- Utilidades ---------- */
function normRut(r) {
  r = String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
  if (r.length < 2) return '';
  const c = r.slice(0, -1).replace(/^0+/, '');
  if (!c || /K/.test(c)) return '';
  return c + '-' + r.slice(-1);
}
function rutValido(rut) {
  const m = /^(\d{1,9})-([\dK])$/.exec(rut);
  if (!m) return false;
  let s = 0, mul = 2;
  for (let i = m[1].length - 1; i >= 0; i--) { s += Number(m[1][i]) * mul; mul = mul === 7 ? 2 : mul + 1; }
  const dv = 11 - (s % 11);
  return (dv === 11 ? '0' : dv === 10 ? 'K' : String(dv)) === m[2];
}
function fmtRut(r) {
  const n = normRut(r); if (!n) return String(r || '');
  const [c, dv] = n.split('-');
  return c.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
}
function fmtFecha(ms) {
  if (!ms) return '';
  return new Date(Number(ms)).toLocaleString('es-CL', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', hour12: false }) + ' h';
}
function aInputFecha(ms) {
  if (!ms) return '';
  const d = new Date(Number(ms)), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
/** "Pérez Soto, Ana María" → "Ana"; "Ana Pérez" → "Ana" */
function primerNombre(n) {
  n = String(n || '').trim();
  const parte = n.includes(',') ? n.split(',')[1] : n;
  return (parte.trim().split(/\s+/)[0]) || n;
}
function colorDe(id, familias) {
  const i = (familias || []).findIndex((f) => f.id === id);
  return COLORES[(i < 0 ? 0 : i) % COLORES.length];
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function pararRefresco() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

function ocupado(btn, on, texto) {
  if (!btn) return;
  if (on) { btn.dataset.txt = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${esc(texto || 'Procesando…')}`; }
  else { btn.disabled = false; if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt; }
}

function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast ' + (tipo || '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 6000 : 3500);
}

function modal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-back" data-act="cerrarModal"></div><div class="modal-card" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false; S.modalAbierto = true;
  const f = m.querySelector('input:not([type=radio]):not([type=hidden]),button.btn-pri');
  if (f) setTimeout(() => f.focus(), 30);
}
function cerrarModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; S.modalAbierto = false; }
function confirmar(titulo, texto, { ok = 'Confirmar', peligro = false } = {}) {
  return new Promise((res) => {
    modal(`<h2>${esc(titulo)}</h2><p class="muted">${texto}</p>
      <div class="acts"><button class="btn" data-act="cerrarModal">Cancelar</button>
      <button class="btn ${peligro ? 'btn-danger solid' : 'btn-pri'}" id="mOk">${esc(ok)}</button></div>`);
    $('#mOk').onclick = () => { cerrarModal(); res(true); };
    $$('#modal [data-act=cerrarModal]').forEach((b) => b.addEventListener('click', () => res(false)));
  });
}

function imprimir(html) {
  $('#print-area').innerHTML = html;
  document.body.classList.add('imprimiendo');
  const limpiar = () => { document.body.classList.remove('imprimiendo'); $('#print-area').innerHTML = ''; };
  window.addEventListener('afterprint', limpiar, { once: true });
  setTimeout(() => { try { window.print(); } catch (e) { toast('Tu navegador no permitió imprimir.', 'err'); } setTimeout(limpiar, 1500); }, 60);
}

function descargarCSV(nombre, filas) {
  const csv = '﻿' + filas.map((f) => f.map((v) => {
    const s = String(v == null ? '' : v);
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  const F = S.filtro, q = F.q.trim().toLowerCase(), qr = normRut(F.q) || F.q.replace(/[^0-9kK]/g, '').toUpperCase();
  return S.panel.estudiantes.filter((e) => {
    if (F.fam === 'SIN' ? e.familia : F.fam && e.familia !== F.fam) return false;
    if (F.curso && e.curso !== F.curso) return false;
    if (!q) return true;
    return e.nombre.toLowerCase().includes(q) || (qr && e.rut.replace('-', '').includes(qr.replace('-', '')));
  }).sort((a, b) => a.curso.localeCompare(b.curso, 'es', { numeric: true }) || a.nombre.localeCompare(b.nombre, 'es'));
}

function parsearCarga(texto) {
  const filas = [];
  texto.split(/\r?\n/).forEach((linea, i) => {
    if (!linea.trim()) return;
    const sep = linea.includes('\t') ? '\t' : linea.includes(';') ? ';' : ',';
    const c = linea.split(sep).map((x) => x.trim().replace(/^"(.*)"$/, '$1').trim());
    while (c.length && c[c.length - 1] === '') c.pop();
    if (!filas.length && /rut/i.test(c[0] || '') && !normRut(c[0])) return; // títulos
    let rut = c[0] || '', nombre = '', curso = '';
    if (c.length === 2) nombre = c[1];
    else if (c.length >= 3) { nombre = c.slice(1, -1).join(' '); curso = c[c.length - 1]; }
    filas.push({ rut, nombre: nombre.replace(/\s+/g, ' ').trim(), curso });
  });
  return filas;
}

function renderPrevia() {
  const el = $('#previa'); if (!el) return;
  const filas = S.carga.filas;
  if (!filas.length) {
    el.innerHTML = `<h3 style="font-weight:800;margin-bottom:6px">Vista previa</h3><p class="muted">Pega la lista a la izquierda y aquí verás cómo quedará antes de guardarla.</p>`;
    return;
  }
  const existentes = Object.fromEntries(S.panel.estudiantes.map((e) => [e.rut, e]));
  const vistos = {};
  let nuevos = 0, act = 0, igual = 0, errs = 0;
  const filasHtml = filas.map((f) => {
    const r = normRut(f.rut);
    let est;
    if (!r || !rutValido(r)) est = '<span class="err-t">RUT inválido</span>';
    else if (!f.nombre) est = '<span class="err-t">Falta nombre</span>';
    else if (vistos[r]) est = '<span class="err-t">Repetido</span>';
    else {
      vistos[r] = 1;
      const ex = existentes[r];
      if (!ex) { est = '<span class="ok-t">Nuevo</span>'; nuevos++; }
      else if (ex.nombre !== f.nombre || ex.curso !== f.curso) { est = '<span class="warn-t">Actualiza</span>'; act++; }
      else { est = '<span class="muted">Sin cambios</span>'; igual++; }
    }
    if (est.includes('err-t')) errs++;
    return `<tr><td class="mono" style="white-space:nowrap">${esc(r ? fmtRut(r) : f.rut)}</td><td>${esc(f.nombre)}</td><td>${esc(f.curso)}</td><td>${est}</td></tr>`;
  });
  el.innerHTML = `<h3 style="font-weight:800">Vista previa</h3>
    <div class="resumen-carga"><span><b class="ok-t">${nuevos}</b>nuevos</span><span><b class="warn-t">${act}</b>actualizan</span>
      <span><b>${igual}</b>sin cambios</span><span><b class="err-t">${errs}</b>con error</span></div>
    <div class="tbl-wrap" style="max-height:340px;overflow:auto;border:1px solid var(--line2);border-radius:10px">
      <table class="tbl"><thead><tr><th>RUT</th><th>Nombre</th><th>Curso</th><th>Estado</th></tr></thead><tbody>${filasHtml.join('')}</tbody></table></div>
    ${errs ? '<p class="hint" style="margin-top:10px">Las filas con error no se cargan. Corrígelas en la lista y vuelve a pegarla.</p>' : ''}
    <button class="btn btn-pri btn-block" style="margin-top:14px" data-act="importar" ${nuevos + act ? '' : 'disabled'}>
      ${nuevos + act ? `Guardar ${nuevos + act} estudiante${nuevos + act === 1 ? '' : 's'}` : 'No hay cambios para guardar'}</button>`;
}

/* ---------- Exportar e imprimir ---------- */
function filasCSV(lista) {
  const fams = S.panel.familias, porId = Object.fromEntries(fams.map((f) => [f.id, f]));
  const orden = Object.fromEntries(fams.map((f, i) => [f.id, i]));
  const ord = lista.slice().sort((a, b) => (a.familia ? orden[a.familia] : 999) - (b.familia ? orden[b.familia] : 999)
    || a.curso.localeCompare(b.curso, 'es', { numeric: true }) || a.nombre.localeCompare(b.nombre, 'es'));
  return [['Familia', 'Electivos', 'RUT', 'Nombre', 'Curso', 'Fecha inscripción', 'Inscrito por', 'Clave inicial pendiente']].concat(
    ord.map((e) => {
      const f = porId[e.familia];
      return [f ? f.nombre : 'Sin inscribir', f ? f.electivos.join(' / ') : '', fmtRut(e.rut), e.nombre, e.curso, e.fecha, e.por, e.claveInicial];
    }));
}
function nombreArchivo(base) {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${base}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.csv`;
}
function fichasHTML(lista) {
  const P = S.panel;
  return `<div class="fichas">${lista.map((e) => `<div class="ficha">
    <div class="ft">${marca()}<b>Selector de Electivos</b><small>${esc(P.colegio)}</small></div>

    <p>${P.enlace ? 'Entra en: <b>' + esc(P.enlace) + '</b><br>' : ''}Elige “Estudiante”, escribe tu RUT y esta clave. La primera vez deberás crear tu propia clave.</p>
  </div>`).join('')}</div>`;
}

      if (!r || !rutValido(r)) { err.textContent = 'Revisa tu RUT: el dígito verificador no coincide.'; return; }
    }
    if (!d.clave) { err.textContent = 'Escribe tu clave.'; return; }
    ocupado(btn, true, 'Entrando…');
    try {
      const r = await call('login', { rol: S.loginRol, usuario: d.usuario, clave: d.clave });
      guardarSesion(r);
      r.debeCambiar ? vistaCambio(true) : entrar();
    } catch (e) { err.textContent = e.message; ocupado(btn, false); }
  },
  async clave(f) {
    const d = Object.fromEntries(new FormData(f)), err = $('#errClave'), btn = f.querySelector('[type=submit]');
    err.textContent = '';
    if ((d.nueva || '').length < 6) { err.textContent = 'La nueva clave debe tener al menos 6 caracteres.'; return; }
    if (d.nueva !== d.repetir) { err.textContent = 'Las claves no coinciden.'; return; }
    ocupado(btn, true, 'Guardando…');
    try {
      await call('cambiarClave', { actual: d.actual || '', nueva: d.nueva });
      S.debeCambiar = false; store.set('se_cambiar', null);
      cerrarModal(); toast('Clave guardada.', 'ok');
      if (d.forzado) entrar();
      else ocupado(btn, false);
    } catch (e) {
      if (e.code === 'SESION') return manejarError(e);
      err.textContent = e.message; ocupado(btn, false);
    }
  },
  async proceso(f) {
    const d = Object.fromEntries(new FormData(f)), err = $('#errProceso'), btn = f.querySelector('[type=submit]');
    err.textContent = '';
    const ms = (v) => (v ? new Date(v).getTime() : 0);
    ocupado(btn, true, 'Guardando…');
    try {
      await call('guardarProceso', { abierto: !!d.abierto, apertura: ms(d.apertura), cierre: ms(d.cierre), colegio: d.colegio, enlace: d.enlace });
      S.panel = await call('panel'); vistaPanel(); toast('Cambios guardados.', 'ok');
    } catch (e) { if (e.code === 'SESION') return manejarError(e); err.textContent = e.message; ocupado(btn, false); }
  },
  async familia(f) {
    const d = Object.fromEntries(new FormData(f)), btn = f.querySelector('[type=submit]');
    ocupado(btn, true, 'Guardando…');
    try {
      await call('guardarFamilia', { id: f.dataset.id, nombre: d.nombre, cupo: d.cupo, electivos: d.electivos.split('\n') });
      toast('Familia guardada.', 'ok'); await recargarPanel();
    } catch (e) { manejarError(e); ocupado(btn, false); }
  },
  async asignar(f) {
    const fam = (new FormData(f)).get('fam') || '', btn = f.querySelector('[type=submit]');
    ocupado(btn, true, 'Guardando…');
    try {
      await call('asignar', { rut: f.dataset.rut, familia: fam });
      cerrarModal(); toast(fam ? 'Familia asignada.' : 'Inscripción quitada.', 'ok'); await recargarPanel();
    } catch (e) { manejarError(e); ocupado(btn, false); }
  }
};

/* ============================================================
 *  EVENTOS
 * ============================================================ */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});
const filtrar = debounce(() => renderTabla(), 120);
const previa = debounce(() => { S.carga.filas = parsearCarga(S.carga.texto); renderPrevia(); }, 200);
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.filtro) { S.filtro[t.dataset.filtro] = t.value; filtrar(); }
  if (t.id === 'txtCarga') { S.carga.texto = t.value; previa(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  // Solo selects: en el buscador "change" llega al perder el foco y redibujar ahí anularía el clic en la tabla.
  if (t.dataset.filtro && t.tagName === 'SELECT') { S.filtro[t.dataset.filtro] = t.value; renderTabla(); }
  if (t.id === 'archivoCsv' && t.files[0]) {
    const archivo = t.files[0];
    const leer = (enc) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(archivo, enc); });
    leer('utf-8').then((txt) => (txt.includes('�') ? leer('windows-1252') : txt)).then((txt) => {
      S.carga.texto = txt.replace(/^﻿/, ''); $('#txtCarga').value = S.carga.texto;
      S.carga.filas = parsearCarga(S.carga.texto); renderPrevia(); t.value = '';
    });
  }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-rut') && normRut(t.value)) t.value = fmtRut(t.value);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modalAbierto) cerrarModal(); });

/* ============================================================
 *  INICIO
 * ============================================================ */
(async function iniciar() {
  try { const p = await call('publico'); S.colegio = p.colegio; } catch (e) {}
  if (!S.token) return vistaLogin();
  if (S.debeCambiar) return vistaCambio(true);
  entrar();
})();
</script>
