<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de Electivos · Liceo Polivalente Nahuelbuta</title>
<meta name="theme-color" content="#067D3E">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
  html, body { margin: 0; height: 100%; background: #EEF0F1; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1D2327; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  .aviso { max-width: 520px; margin: 12vh auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 6px 24px -8px rgba(0,0,0,.15); line-height: 1.5; }
  .aviso code { background: #E2F1E8; color: #067D3E; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<!--
  Esta página muestra la aplicación de Apps Script a pantalla completa.
  Al ir dentro de este marco, Google no muestra el aviso
  "Esta aplicación fue creada por otro usuario".

  ► Pega abajo, entre las comillas, el enlace /exec de tu implementación.
-->
<script>
  const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzx_AF2q8k_zDZGGxThQh_-UJJ0HW8f0ewLsL2z_n02cE543hbX0rWSh1eS0qmVxMk/exec';

  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(URL_APPS_SCRIPT)) {
    document.body.innerHTML = '<div class="aviso"><h2>Falta un paso</h2><p>Edita <code>index.html</code> en GitHub y pega el enlace <code>/exec</code> de la aplicación web de Apps Script en <code>URL_APPS_SCRIPT</code>.</p></div>';
  } else {
    const f = document.createElement('iframe');
    f.src = URL_APPS_SCRIPT;
    f.title = 'Selector de Electivos';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
