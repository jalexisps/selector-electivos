<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de Electivos</title>
<meta name="theme-color" content="#F4F1EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='5' width='34' height='8.5' rx='4.25' fill='%230E7C7B'/%3E%3Crect x='3' y='15.75' width='25' height='8.5' rx='4.25' fill='%23D1495B'/%3E%3Crect x='3' y='26.5' width='30' height='8.5' rx='4.25' fill='%235B4BC4'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F4F1EA; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #1A2132; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  .aviso { max-width: 520px; margin: 12vh auto; padding: 28px; background: #fff; border-radius: 18px; box-shadow: 0 6px 24px -8px rgba(0,0,0,.15); line-height: 1.5; }
  .aviso code { background: #E8ECFB; color: #2442C4; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<!--
  Esta página muestra la aplicación de Apps Script a pantalla completa.
  Al ir dentro de este marco, Google no muestra el aviso
  "Esta aplicación fue creada por otro usuario".

  ► Pega abajo, entre las comillas, el enlace /exec de tu implementación.
-->
<script>
  const URL_APPS_SCRIPT = 'PEGA_AQUI_EL_ENLACE_EXEC';

  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(URL_APPS_SCRIPT)) {
    document.body.innerHTML = '<div class="aviso"><h2>Falta un paso</h2><p>Edita <code>index.html</code> en GitHub y pega el enlace <code>/exec</code> de la aplicación web de Apps Script en <code>URL_APPS_SCRIPT</code>.</p></div>';
  } else {
    const f = document.createElement('iframe');
    f.src = URL_APPS_SCRIPT;
    f.title = 'Selector de Electivos';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
